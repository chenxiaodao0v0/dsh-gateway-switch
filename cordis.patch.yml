# 本插件自带的 patch 层：被 dsh.profile.bundles / cordis.patch.yml 引用后自动插入一条 Loader 条目。
#
# config 全是可选项，省略即用 index.js 里的默认值。
- insert:
    - id: gateway-switch
      name: dsh-plugin-gateway-switch
      config:
        # 被切换的凭据引用名。它同时就是 provider 里 apiKeyEnv 写的那个名字。
        # 透传 provider 的写法：apiKeyEnv: OPENVIKING_GATEWAY_KEY
        credentialRef: OPENVIKING_GATEWAY_KEY
        # 探活用的网关根地址（不含 /v1）。本机 OpenViking 网关默认 http://localhost:1933/gateway
        gatewayBaseURL: http://localhost:1933/gateway

        # 共享记忆控制台地址。加入团队后插件会把「个人 key + 团队 key」
        # 登记过去，定时回流据此知道同步给谁；留空 = 只切换 key，不登记。
        # 团队默认值见下，可用环境变量 DSH_SYNC_URL 覆盖。
        syncBaseURL: http://192.168.10.4:8765
        # 团队版不需要控制台 token：/api/team/join 由「key 能反查到本账号用户」鉴权。
        # 只有控制台管理员自己调其它 /api/* 时才需要 token，用环境变量 DSH_SYNC_TOKEN 注入。
        syncToken: ''
